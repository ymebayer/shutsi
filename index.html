<style>
:root{--bg:#E9F4FF;--paper:#FFFFFF;--text:#15234A;--muted:#55658A;--line:#15234A;--cel:#74ACDF;--cel2:#D6EAFB;--sun:#F6B40E;--sun2:#FFF0C4;--red:#EE5546;--red2:#FFE1DC;--grn:#16A15E;--grn2:#D2F4E1;--vio:#7A5BF2;--vio2:#E7E0FF;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C172E;--paper:#16294B;--text:#EEF4FF;--muted:#A7B7D7;--line:#040A16;--cel:#5B93CF;--cel2:#1C355B;--sun:#F2B52A;--sun2:#3A300F;--red:#FF6A5C;--red2:#47211D;--grn:#2DBE76;--grn2:#123C29;--vio:#937BFF;--vio2:#2A2256;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0C172E;--paper:#16294B;--text:#EEF4FF;--muted:#A7B7D7;--line:#040A16;--cel:#5B93CF;--cel2:#1C355B;--sun:#F2B52A;--sun2:#3A300F;--red:#FF6A5C;--red2:#47211D;--grn:#2DBE76;--grn2:#123C29;--vio:#937BFF;--vio2:#2A2256;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:radial-gradient(130% 55% at 50% -12%,var(--sun2) 0,transparent 60%) no-repeat,var(--bg);color:var(--text);font:17px/1.5 "Varela Round","Rubik",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:4px solid var(--cel);outline-offset:3px}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px 48px}
h1,h2,h3{font-family:"Rubik","Varela Round",sans-serif;font-weight:800;line-height:1.2;margin:0}
h1{font-size:clamp(26px,7vw,34px)}h3{font-size:19px;margin:22px 0 10px}
.muted{color:var(--muted)}.center{text-align:center;justify-content:center}
.es{font-family:"Fredoka","Rubik",sans-serif}
.btn{font-family:"Rubik",sans-serif;font-weight:700;font-size:17px;background:var(--paper);color:var(--text);border:3px solid var(--line);border-radius:18px;padding:11px 18px;box-shadow:0 5px 0 var(--line);cursor:pointer;transition:transform .08s,box-shadow .08s;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--sun);color:#15234A}
.btn.warn{background:var(--red);color:#fff}
.btn.big{width:100%;font-size:20px;padding:14px 18px;margin-top:14px}
.btn.icon{width:50px;height:50px;padding:0;font-size:22px;flex:none}
.btn.sel{background:var(--cel);color:#15234A}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;padding:10px;cursor:pointer;font-weight:700}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.row>.btn{flex:1}
.top{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.top .ttl{flex:1;font-size:22px}
.chips{display:flex;gap:8px;margin-inline-start:auto}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--paper);border:2.5px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:700;box-shadow:0 3px 0 var(--line);white-space:nowrap}
.chip.hot{background:var(--sun2)}
.avbtn{width:52px;height:52px;border-radius:50%;border:3px solid var(--line);background:var(--cel2);font-size:30px;box-shadow:0 4px 0 var(--line);cursor:pointer;flex:none;padding:0}
.hero{display:flex;align-items:center;gap:16px;margin:4px 0 18px}
.sun{position:relative;width:128px;height:128px;flex:none}
.sun svg{width:100%;height:100%;overflow:visible}
.ray{fill:var(--cel2);stroke:var(--line);stroke-width:2.5;stroke-linejoin:round}
.ray.on{fill:var(--sun)}
.disc{fill:var(--paper);stroke:var(--line);stroke-width:3}
.sun .face{position:absolute;inset:0;display:grid;place-items:center;font-size:50px}
.hello p{margin:6px 0}
.lvl{font-weight:700}
.bar{height:14px;border:2.5px solid var(--line);border-radius:999px;background:var(--paper);overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--sun)}
.modes{display:grid;gap:14px}
.mode{display:grid;grid-template-columns:62px 1fr;column-gap:14px;align-items:center;text-align:start;border:3px solid var(--line);border-radius:26px;padding:16px 18px;box-shadow:0 6px 0 var(--line);cursor:pointer;transition:transform .08s,box-shadow .08s;color:var(--text)}
.mode:active{transform:translateY(5px);box-shadow:0 1px 0 var(--line)}
.mode .ic{grid-row:1/4;width:62px;height:62px;display:grid;place-items:center;font-size:34px;background:var(--paper);border:3px solid var(--line);border-radius:20px}
.mode b{font-family:"Rubik",sans-serif;font-size:23px;font-weight:800}
.mode .ds{color:var(--muted)}
.mode em{font-style:normal;font-weight:700;font-size:15px}
.m1{background:var(--cel2)}.m2{background:var(--sun2)}.m3{background:var(--vio2)}
.card{background:var(--paper);border:3px solid var(--line);border-radius:28px;box-shadow:0 6px 0 var(--line);padding:20px;margin-bottom:16px}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:10px}
.cat{display:grid;gap:4px;text-align:start;background:var(--paper);border:3px solid var(--line);border-radius:20px;padding:12px;box-shadow:0 4px 0 var(--line);cursor:pointer}
.cat .em{font-size:30px}.cat b{font-family:"Rubik",sans-serif}.cat small{color:var(--muted)}
.mini{display:block;height:8px;border-radius:5px;background:var(--cel2);overflow:hidden}
.mini u{display:block;height:100%;background:var(--grn)}
.dots{flex:1;display:flex;gap:5px}
.d{flex:1;height:12px;border-radius:6px;background:var(--cel2);border:2px solid var(--line)}
.d.ok{background:var(--grn)}.d.no{background:var(--red)}.d.cur{background:var(--sun)}
.word-card{text-align:center}
.pic{font-size:76px;line-height:1;animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.es-word{font-family:"Fredoka","Rubik",sans-serif;font-weight:600;font-size:clamp(34px,11vw,54px);line-height:1.2;margin:8px 0 2px;overflow-wrap:anywhere}
.sy.st{color:var(--red);text-decoration:underline 4px var(--sun);text-underline-offset:7px}
.dot{font-style:normal;color:var(--muted);opacity:.6;font-weight:400;margin:0 1px}
.translit{font-family:"Noto Sans Hebrew","Arial Hebrew",Arial,sans-serif;font-weight:700;font-size:clamp(26px,8vw,38px);line-height:1.7;margin:4px 0}
.translit .sy.st{text-underline-offset:12px}
.meaning{font-size:22px;font-weight:700;margin:6px 0 4px}
.gtag,.rev{display:inline-block;font-size:14px;font-weight:700;border:2px solid var(--line);border-radius:999px;padding:1px 10px;margin:0 3px}
.gtag.m{background:var(--cel2)}.gtag.f{background:var(--red2)}.rev{background:var(--vio2)}
.speak{text-align:center;margin-top:6px}
.mic{width:104px;height:104px;border-radius:50%;font-size:46px;background:var(--red);border:3px solid var(--line);box-shadow:0 6px 0 var(--line);cursor:pointer;margin:6px auto 4px;display:grid;place-items:center;padding:0}
.mic.on{background:var(--grn);animation:pulse 1.1s infinite}
.mic.idle{background:var(--cel2)}div.mic{cursor:default}
.hint{font-weight:700;margin:6px 0}
.res .stars{font-size:44px;letter-spacing:4px}
.res .off{opacity:.35}
.res .msg{font-size:21px;font-weight:800;font-family:"Rubik",sans-serif;margin:4px 0}
.heard{color:var(--muted);margin:4px 0}
.lead{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.loro{font-size:38px;line-height:1}
.bubble{background:var(--paper);border:2.5px solid var(--line);border-radius:16px 16px 4px 16px;padding:6px 14px;font-weight:700}
.qcard{text-align:center;position:relative}
.spk{position:absolute;top:12px;inset-inline-end:12px}
.sent{font-family:"Fredoka","Rubik",sans-serif;font-weight:600;font-size:clamp(23px,6.6vw,31px);line-height:1.45;margin:34px 0 8px}
.blank{display:inline-block;min-width:2.6em;padding:0 .25em;border-bottom:4px dashed var(--cel);color:var(--cel)}
.blank.ok{color:var(--grn);border-bottom-style:solid;border-color:var(--grn)}
.blank.no{color:var(--red);border-bottom-style:solid;border-color:var(--red)}
.he-tr{color:var(--muted);font-size:18px;margin:6px 0 0}
.he-tr.big{color:var(--text);font-size:21px;font-weight:700;margin:40px 0 14px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{font-family:"Fredoka","Rubik",sans-serif;font-weight:600;font-size:21px;background:var(--paper);color:var(--text);border:3px solid var(--line);border-radius:18px;padding:12px 8px;min-height:62px;box-shadow:0 5px 0 var(--line);cursor:pointer;transition:transform .08s,box-shadow .08s}
.opt:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.opt.right{background:var(--grn);color:#fff}.opt.wrong{background:var(--red);color:#fff;animation:shake .4s}.opt.dim{opacity:.45}
.line{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:66px;border:3px dashed var(--cel);border-radius:18px;padding:10px;align-items:center}
.line.ok{border-style:solid;border-color:var(--grn);background:var(--grn2)}
.line.no{border-style:solid;border-color:var(--red);background:var(--red2)}
.ph{color:var(--muted);font-family:"Varela Round",sans-serif}
.bank{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:4px 0 6px}
.tile{font-family:"Fredoka","Rubik",sans-serif;font-weight:600;font-size:20px;background:var(--paper);color:var(--text);border:3px solid var(--line);border-radius:14px;padding:8px 14px;box-shadow:0 4px 0 var(--line);cursor:pointer}
.tile.used{visibility:hidden}
.correct{font-family:"Fredoka",sans-serif;font-weight:600;color:var(--grn);font-size:20px;margin:10px 0 0}
.fb{margin-top:16px;border:3px solid var(--line);border-radius:22px;padding:14px 16px;box-shadow:0 5px 0 var(--line)}
.fb.ok{background:var(--grn2)}.fb.no{background:var(--red2)}
.fbt{font-size:20px;font-weight:800;font-family:"Rubik",sans-serif;margin:0}
.tip{margin:8px 0 0}
.sum{text-align:center}
.trophy{font-size:84px;animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
.big-stars{font-family:"Rubik",sans-serif;font-weight:800;font-size:34px;margin:6px 0}
.revlist{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:8px}
.revlist li{display:grid;grid-template-columns:28px 1fr;column-gap:8px;background:var(--paper);border:2.5px solid var(--line);border-radius:14px;padding:8px 12px}
.revlist li>span{grid-row:1/3}
.revlist b{font-family:"Fredoka",sans-serif;font-weight:600}
.revlist small{color:var(--muted)}
.newb{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.ladder{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px}
.rung{flex:none;width:72px;text-align:center;background:var(--paper);border:2.5px solid var(--line);border-radius:16px;padding:6px 4px;opacity:.5;filter:grayscale(1)}
.rung.on{opacity:1;filter:none;background:var(--sun2)}
.rung span{font-size:28px;display:block}
.rung small{font-family:"Fredoka",sans-serif;font-size:12px;display:block}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{background:var(--paper);border:2.5px solid var(--line);border-radius:18px;padding:12px;text-align:center;opacity:.6}
.badge.got{opacity:1;background:var(--sun2)}
.badge span{font-size:34px;display:block}.badge b{display:block}.badge small{color:var(--muted);font-size:13px}
.welcome{text-align:center;margin:10px 0 16px}
.hero-loro{font-size:88px;line-height:1;display:inline-block;animation:bob 2.2s ease-in-out infinite alternate}
.welcome p{font-size:19px;margin:8px 0}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.pcard{display:grid;justify-items:center;gap:4px;background:var(--paper);border:3px solid var(--line);border-radius:22px;padding:16px 10px;box-shadow:0 5px 0 var(--line);cursor:pointer}
.pcard .pav{font-size:46px}.pcard b{font-family:"Rubik",sans-serif;font-size:19px}.pcard small{color:var(--muted)}
.form{display:grid;gap:14px}
.form label{display:grid;gap:6px;font-weight:700}
.form input[type=text],.form select{font:inherit;font-size:18px;padding:11px 12px;border:3px solid var(--line);border-radius:14px;background:var(--paper);color:var(--text);width:100%}
.form input[type=range]{width:100%;accent-color:var(--sun)}
.form .sw{display:flex;align-items:center;gap:10px}
.sw input{width:22px;height:22px;accent-color:var(--grn)}
fieldset{border:0;padding:0;margin:0}
legend{font-weight:700;margin-bottom:6px;padding:0}
.seg{display:flex;gap:10px}.seg .btn{flex:1}
.avs{display:flex;flex-wrap:wrap;gap:8px}
.av-b{width:56px;height:56px;font-size:30px;border:3px solid var(--line);border-radius:16px;background:var(--paper);box-shadow:0 3px 0 var(--line);cursor:pointer;padding:0}
.av-b.sel{background:var(--sun)}
.info p{margin:4px 0}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60}
.cf{position:absolute;top:-40px;font-size:24px;animation:fall 1.5s ease-in forwards}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,200%);background:var(--text);color:var(--bg);font-weight:700;padding:10px 18px;border-radius:16px;z-index:70;transition:transform .25s;max-width:92vw;text-align:center}
#toast.on{transform:translate(-50%,0)}
#modal{position:fixed;inset:0;display:none;place-items:center;background:rgba(5,12,30,.5);z-index:80;padding:20px}
#modal.on{display:grid}
.sheet{background:var(--paper);border:3px solid var(--line);border-radius:24px;padding:20px;max-width:420px;width:100%;box-shadow:0 6px 0 var(--line)}
.sheet p{font-size:19px;font-weight:700;margin:0 0 6px}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes bob{from{transform:translateY(0) rotate(-4deg)}to{transform:translateY(-8px) rotate(4deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes pulse{0%{box-shadow:0 6px 0 var(--line),0 0 0 0 rgba(22,161,94,.5)}100%{box-shadow:0 6px 0 var(--line),0 0 0 24px rgba(22,161,94,0)}}
@keyframes fall{to{transform:translate(var(--dx,0),110vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-width:380px){.hero{flex-direction:column;text-align:center}.opts{grid-template-columns:1fr}}
button,.tile,.mcard,.stk{touch-action:manipulation;-webkit-user-select:none;user-select:none}
.tdot{font-family:"Fredoka",sans-serif;font-weight:700;font-size:24px;align-self:flex-end}
.chest{animation:glow 1.6s ease-in-out infinite alternate;margin:0 0 14px}
@keyframes glow{from{box-shadow:0 5px 0 var(--line),0 0 0 0 rgba(246,180,14,.65)}to{box-shadow:0 5px 0 var(--line),0 0 0 12px rgba(246,180,14,0)}}
.journey{display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:var(--paper);border:3px solid var(--line);border-radius:22px;padding:12px 14px;box-shadow:0 5px 0 var(--line);margin:0 0 14px;cursor:pointer;color:var(--text)}
.journey .jem{font-size:34px;flex:none}.journey b{display:block;font-family:"Rubik",sans-serif}.journey small{color:var(--muted)}
.game{display:flex;gap:14px;align-items:center;width:100%;text-align:start;border:3px solid var(--line);border-radius:24px;padding:16px;box-shadow:0 6px 0 var(--line);margin-bottom:14px;cursor:pointer;color:var(--text)}
.game.g1{background:var(--vio2)}.game.g2{background:var(--red2)}
.game .gic{font-size:44px;flex:none}.game b{display:block;font-family:"Fredoka","Rubik",sans-serif;font-size:24px}.game small{display:block;color:var(--muted)}.game em{font-style:normal;font-weight:700;font-size:14px}
.memo{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mcard{aspect-ratio:3/4;border:3px solid var(--line);border-radius:14px;background:var(--cel);box-shadow:0 4px 0 var(--line);display:grid;place-items:center;align-content:center;gap:2px;padding:4px;cursor:pointer;color:var(--text);font-family:"Fredoka","Rubik",sans-serif;overflow:hidden}
.mcard .back{font-size:30px}.mcard.open{background:var(--paper);animation:flip .25s}.mcard.done{background:var(--grn2);border-color:var(--grn)}
.mcard b{font-size:clamp(13px,3.6vw,18px);font-weight:600;line-height:1.15;overflow-wrap:anywhere}
.mcard .me{font-size:26px}.mcard small{font-family:"Varela Round",sans-serif;font-size:13px;font-weight:700;line-height:1.2}
@keyframes flip{from{transform:rotateY(90deg)}to{transform:rotateY(0)}}
.tbar{flex:1;height:16px;border:2.5px solid var(--line);border-radius:999px;background:var(--paper);overflow:hidden}
.tbar i{display:block;height:100%;background:var(--grn);transition:width .2s linear}
.speed-score{font-family:"Rubik",sans-serif;font-weight:800;font-size:22px;text-align:start}
.opt.he{font-family:"Varela Round","Rubik",sans-serif;font-size:19px}
.stk-row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.stk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
.stk{position:relative;display:grid;justify-items:center;gap:2px;background:var(--paper);border:3px solid var(--line);border-radius:16px;padding:10px 6px 8px;box-shadow:0 4px 0 var(--line);cursor:pointer;color:var(--text);min-width:100px}
.stk .se{font-size:40px;line-height:1.1}.stk b{font-family:"Fredoka",sans-serif;font-weight:600;font-size:15px}.stk small{color:var(--muted);font-size:12px}.stk i{font-style:normal;font-size:11px;font-weight:700}
.stk.rare{background:linear-gradient(160deg,var(--cel2),var(--paper))}
.stk.legend{background:linear-gradient(160deg,var(--sun2),var(--paper));border-color:var(--sun)}
.stk.reveal{animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
.stk.empty{opacity:.5;border-style:dashed;cursor:default;box-shadow:none}
.stk .cnt{position:absolute;top:-8px;inset-inline-start:-8px;background:var(--red);color:#fff;border:2px solid var(--line);border-radius:999px;font-size:12px;padding:0 6px;font-style:normal}
.album-head b{font-family:"Rubik",sans-serif;font-size:22px}
.trail{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:10px}
.trail li{display:flex}.trail li:nth-child(even){justify-content:flex-end}
.stn{display:flex;gap:10px;align-items:center;width:88%;text-align:start;background:var(--paper);border:3px solid var(--line);border-radius:20px;padding:10px 12px;box-shadow:0 4px 0 var(--line);cursor:pointer;color:var(--text)}
.stn .sem{font-size:32px;flex:none}.stn b{display:block;font-family:"Fredoka",sans-serif;font-weight:600;font-size:19px}.stn small{color:var(--muted);font-size:14px;line-height:1.35;display:block}
.trail .past .stn{background:var(--grn2)}.trail .here .stn{background:var(--sun2);animation:glow 1.6s ease-in-out infinite alternate}.trail .lock .stn{opacity:.6;cursor:default}
.arrive{text-align:center;background:var(--sun2);margin-top:14px}.arrive .jbig{font-size:56px}.arrive b{font-size:22px}
.intro{text-align:center;padding-top:8px}

<script>/* ===== SP: syllables, stress and Hebrew transliteration (Rioplatense Spanish) ===== */

    checkBadges(); save(); render(); wait(650).then(() => S.round === R ? say(ok ? R.praise : 'No. La respuesta correcta es:') : null).then(() => { if (S.round === R) say(t[2]); });
  },
  tvnext: () => { const R = S.round; if (!R || R.kind !== 'triv') return; R.idx++; if (R.idx >= R.items.length) { endTriv(R); return; } prepTriv(); render(); sayTriv(); },
  tvsay: () => sayTriv(),
  sayarg: () => { const a = argOfDay(); say(a[0]).then(() => wait(350)).then(() => say(a[2])); },
  speed: () => startSpeed(),
  flip: v => {
    const R = S.round; if (!R || R.kind !== 'memo' || R.lock) return;
    const j = +v, c = R.cards[j]; if (!c || c.open || c.done) return;
    c.open = true; SFX.tap();
    if (c.side === 'es') say(WORDS[c.i].es);
    if (R.first < 0) { R.first = j; render(); return; }
    const a = R.cards[R.first]; R.first = -1; R.moves++;
    if (a.k === c.k) {
      a.done = c.done = true; a.open = c.open = false; R.found++; SFX.ok(); confetti(10); flash(true, '', true);
      if (c.side !== 'es') say(WORDS[c.i].es);
      render();
      if (R.found === R.pairs) setTimeout(() => endMemo(R), 800);
    } else {
      R.lock = true; SFX.bad(); flash(false, '', true); render();
      setTimeout(() => { if (S.round !== R) return; a.open = c.open = false; R.lock = false; render(); }, 1000);
    }
  },
  sp: v => {
    const R = S.round; if (!R || R.kind !== 'speed' || R.lock || R.ended) return;
    const q = R.q, j = +v; q.pick = j; R.lock = true;
    const ok = q.opts[j] === q.right;
    if (ok) { R.score++; R.combo++; SFX.ok(); if (R.combo % 5 === 0) { R.score++; toast('🔥 5 ברצף! נקודת בונוס'); } }
    else { R.combo = 0; SFX.bad(); }
    flash(ok, '', true);
    render();
    setTimeout(() => { if (S.round !== R || R.ended || Date.now() >= R.end) return; nextSpeed(); if (S.round !== R) return; render(); say(WORDS[R.q.i].es); }, ok ? 350 : 900);
  },
  quitg: async () => { if (await ask('לצאת מהמשחק?', 'יציאה', 'ממשיכים לשחק')) { const R = S.round; if (R && R.timer) clearInterval(R.timer); S.round = null; go('games'); } },
  saystk: v => { const x = STICKERS[+v]; if (x) say(x[1]); },
  stn: v => { const J = JOURNEY[+v]; if (J) say(J[1]); },
  home: () => { S.round = null; go('home'); },
  quit: async () => { if (await ask('לצאת מהסיבוב? מה שכבר עשית נשמר.', 'יציאה', 'ממשיכים לשחק')) { S.round = null; go('home'); } },
  words: () => go('cats'),
  wround: v => startWordRound(v),
  start: v => startQRound(+v),
  sayw: () => replay(curWord().es),
  sayslow: () => replay(curWord().es, { rate: 0.6 }),
  sayhe: () => replay(curWord().he.replace(/\(.*?\)/g, '').split(';')[0], { lang: 'he' }),
  listen: () => { const R = S.round; if (micMode() === 'live' && SRC && !srBlocked && Live.start()) { R.phase = 'listen'; R.listenAt = Date.now(); R.quiet = false; R.fx = ''; armQuiet(); render(); SFX.go(); return; } doListen(); },
  stop: () => { try { if (REC) REC.stop(); } catch (e) {} },
  selfok: () => { const R = S.round; if (R.res[R.idx] !== undefined) return; R.res[R.idx] = true; updateWord(curWord(), true); R.combo = 0; addStars(1); checkBadges(); save(); R.last = { stars: 1, heard: '', self: true }; R.phase = 'result'; R.fx = ''; render(); flash(true, '👍'); say(curWord().es).then(() => scheduleNext()); },
  skip: () => { const R = S.round; if (R.res[R.idx] === undefined) { R.res[R.idx] = false; R.combo = 0; updateWord(curWord(), false); save(); } nextItem(); },
  next: () => nextItem(),
  sayq: () => sayQ(S.round.items[S.round.idx], true),
  opt: v => { const R = S.round; if (!R || R.ans != null) return; answer(R.opts[+v] === R.items[R.idx].ans, +v); },
  place: v => { const R = S.round, t = R.wo.bank[+v]; if (!t || t.used || R.ans != null) return; t.used = true; R.wo.placed.push({ w: t.w, b: +v }); SFX.tap(); render(); },
  unplace: v => { const R = S.round; if (R.ans != null) return; const t = R.wo.placed.splice(+v, 1)[0]; if (t) R.wo.bank[t.b].used = false; render(); },
  check: () => { const R = S.round, it = R.items[R.idx]; if (R.ans != null) return; answer(R.wo.placed.map(t => t.w).join(' ') === it.tiles.join(' '), -1); },
  again: () => { const R = S.round; if (R.kind === 'w') startWordRound(R.cat); else startQRound(R.part); },
  badges: () => go('badges'),
  settings: () => go('settings'),
  profiles: () => { S.round = null; go('profiles'); },
  pick: v => { S.p = S.data.profiles[v]; S.data.current = v; save(); go('home'); },
  newp: () => { S.temp = {}; go('new'); },
  setg: v => { S.temp.g = v; render(); },
  setav: v => { S.temp.av = v; render(); },
  create: () => {
    const n = (S.temp.name || '').trim();
    if (!n) { toast('קודם כותבים את השם 🙂'); return; }
    if (!S.temp.g) { toast('בוחרים: בן או בת'); return; }
    newProfile(n.slice(0, 20), S.temp.g, S.temp.av || '🦜'); S.temp = {}; go('home'); say('¡Hola, ' + n + '!');
  },
  myav: v => { S.p.avatar = v; save(); render(); },
  testvoice: () => say('¡Hola! Soy Loro. ¿Cómo andás? ¡Vamos a aprender español!'),
  rename: () => { const el = $('#rname'), n = el && el.value.trim(); if (n) { S.p.name = n.slice(0, 20); save(); toast('השם נשמר'); render(); } },
  delp: async () => {
    if (!(await ask(`למחוק את ${S.p.name} ואת כל ההתקדמות?`, 'מחיקה', 'ביטול'))) return;
    const id = S.p.id; delete S.data.profiles[id]; Cloud.pend.add(id); S.p = null; S.data.current = null; save();
    go(Object.keys(S.data.profiles).length ? 'profiles' : 'new');
  },
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b || b.disabled) return;
  const f = A[b.dataset.a]; if (!f) return;
  e.preventDefault(); ac();
  try { const r = f(b.dataset.v, b); if (r && r.catch) r.catch(err => console.error(err)); } catch (err) { console.error(err); toast('אופס, משהו השתבש. נסו שוב.'); }
});
document.addEventListener('input', e => { if (e.target.id === 'pname') S.temp.name = e.target.value; });
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'pname') A.create(); });
document.addEventListener('change', e => {
  const t = e.target, k = t.dataset && t.dataset.k; if (!k) return;
  let v = t.type === 'checkbox' ? t.checked : t.value;
  if (k === 'rate') v = parseFloat(v); if (k === 'len') v = parseInt(v, 10);
  S.data.settings[k] = v; save();
  if (k === 'theme') applyTheme();
  if (k === 'mic' || k === 'sr') Live.stop();
  if (k === 'voice') loadVoices();
  if (k === 'rate' || k === 'voice') say('¡Hola! ¿Cómo andás?');
  if (k === 'translit' || k === 'heVoice') render();
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) return; hush(); Live.stop(); const R = S.round; if (R && R.kind === 'w' && (R.phase === 'listen' || R.phase === 'intro')) { R.phase = 'ready'; render(); } });

/* ---------- start ---------- */
S.data = loadLocal(); applyTheme();
Object.values(S.data.profiles).forEach(migrate);
if (S.data.current && S.data.profiles[S.data.current]) { S.p = S.data.profiles[S.data.current]; S.screen = 'home'; }
else S.screen = Object.keys(S.data.profiles).length ? 'profiles' : 'new';
if (!S.data.introSeen) S.screen = 'intro';
if (location.hash === '#test') window.__loro = { S, WORDS, STICKERS, JOURNEY, judge, starsFor, Live };
render();
loadVoices();
if ('speechSynthesis' in window) { try { window.speechSynthesis.onvoiceschanged = () => { loadVoices(); if (S.screen === 'settings') render(); }; } catch (e) {} }
cloudInit();
setTimeout(() => { try { getItems(); } catch (e) { console.error(e); } }, 500);
})();
</script>
